name: V2 staging acceptance

# Manual only. Drives the deployed staging API as two ephemeral
# users (minted and deleted by the script) and prints one ACCEPT
# line per gate. Never touches production; every target in the
# script is pinned to staging.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-staging-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run staging acceptance
        run: node scripts/v2-staging-acceptance.mjs
