name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gateway_smoke:
        description: "Run synthetic Responses checks through the staging gateway (no deploy)"
        type: boolean
        default: false
      deploy_production:
        description: "Also deploy production after tests pass"
        type: boolean
        default: false

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: HyggeCore tests
        run: swift test --disable-sandbox
      - name: User-facing copy check
        run: node scripts/check-user-copy.mjs
      - name: Flame assets are full-frame APNGs
        run: python3 scripts/check-flame-assets.py
      - name: Release app-link validation tests
        run: python3 scripts/test-release-app-links.py
      - name: Ensure Metal compiler for flame stretch shader
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: iOS build (unsigned)
        run: >
          xcodebuild -project Hygge.xcodeproj -scheme Hygge
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: ./node_modules/.bin/tsc --noEmit
      - run: npm test
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run -c wrangler.staging.jsonc --outdir /tmp/hygge-browser-test-bundle
      - name: Install retained-container test dependencies
        run: npm --prefix container ci --ignore-scripts
      - name: Browser capabilities in isolated Chrome
        run: npm run test:browser
        env:
          BROWSER_TEST_EXECUTABLE: /usr/bin/google-chrome
          HYGGE_TEST_CHROME: /usr/bin/google-chrome
          BROWSER_TEST_BUNDLE: /tmp/hygge-browser-test-bundle/index.js

  deploy-staging:
    needs: [core-tests, backend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Ensure password confirmation table
        run: npx wrangler d1 execute hygge-staging -c wrangler.staging.jsonc --remote --file migrations/0007_password_confirmations.sql
      - name: Ensure mission queues
        run: |
          for q in hygge-missions-staging hygge-missions-staging-dlq; do
            npx wrangler queues list | grep -qw "$q" || npx wrangler queues create "$q"
          done
      - name: Ensure workspace checkpoint bucket
        run: npx wrangler r2 bucket info hygge-workspace-checkpoints-staging >/dev/null 2>&1 || npx wrangler r2 bucket create hygge-workspace-checkpoints-staging
      - name: Ensure shared skills V2 tables
        run: npx wrangler d1 execute hygge-staging -c wrangler.staging.jsonc --remote --file migrations/0008_shared_skills_v2.sql
      - name: Deploy staging
        run: npx wrangler deploy -c wrangler.staging.jsonc
      - name: Health check
        run: curl -fsS https://api-staging.usehygge.app/health

  deploy-production:
    needs: [core-tests, backend-tests]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Ensure password confirmation table
        run: npx wrangler d1 execute hygge-production -c wrangler.production.jsonc --remote --file migrations/0007_password_confirmations.sql
      - name: Ensure mission queues
        run: |
          for q in hygge-missions-production hygge-missions-production-dlq; do
            npx wrangler queues list | grep -qw "$q" || npx wrangler queues create "$q"
          done
      - name: Ensure workspace checkpoint bucket
        run: npx wrangler r2 bucket info hygge-workspace-checkpoints-production >/dev/null 2>&1 || npx wrangler r2 bucket create hygge-workspace-checkpoints-production
      - name: Ensure shared skills V2 tables
        run: npx wrangler d1 execute hygge-production -c wrangler.production.jsonc --remote --file migrations/0008_shared_skills_v2.sql
      - name: Deploy production
        run: npx wrangler deploy -c wrangler.production.jsonc
      - name: Health check
        run: curl -fsS https://api.usehygge.app/health

  responses-gateway-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.gateway_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      # Try the existing deployment token; no token or policy is created/changed.
      # A 403 is a credential gap, never permission to bypass the gateway.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test text, vision, streaming and synthetic tools through staging gateway
        run: node --experimental-strip-types scripts/responses-gateway-smoke.mts
