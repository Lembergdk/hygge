name: APNs secret sync

# Manual: Actions -> APNs secret sync -> Run workflow.
# Copies the HYGGE_APNS_KEY_P8 GitHub secret (the .p8 for key id
# P7AKJ8SZL4, team 3KA38L8A4F — ids live in both wrangler configs)
# into the staging and production workers as a wrangler secret,
# then lists secret names so the run log proves it landed.
# Re-run after rotating the key: update the GitHub secret first.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYGGE_APNS_KEY_P8: ${{ secrets.HYGGE_APNS_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Put APNs secret (staging)
        run: printf '%s' "$HYGGE_APNS_KEY_P8" | npx wrangler secret put HYGGE_APNS_KEY_P8 -c wrangler.staging.jsonc
      - name: Put APNs secret (production)
        run: printf '%s' "$HYGGE_APNS_KEY_P8" | npx wrangler secret put HYGGE_APNS_KEY_P8 -c wrangler.production.jsonc
      - name: List secrets (names only)
        run: |
          echo "--- staging"
          npx wrangler secret list -c wrangler.staging.jsonc
          echo "--- production"
          npx wrangler secret list -c wrangler.production.jsonc
