name: Publish workspace image

# Manual only. This publishes a new immutable workspace image and
# reports its digest; it never changes Wrangler config or deploys a
# worker. Changing an environment or owner image policy remains a
# separate reviewed image-upgrade change.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable release tag for hygge-workspace"
        required: true
        type: string

      verify_source_image:
        description: "Optional exact source image for verification-only mode"
        required: false
        type: string
      verify_target_image:
        description: "Optional exact target image; verifies the pair without publishing"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.verify_target_image == '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IMAGE_TAG: ${{ inputs.tag }}
      IMAGE_REPOSITORY: registry.cloudflare.com/89a95a21e6a6b7c15bbd8e148a6c6242/hygge-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build linux/amd64 workspace image
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          docker build --platform linux/amd64 -f container/Dockerfile -t "hygge-workspace:$IMAGE_TAG" .
      - name: Push to Cloudflare managed registry
        run: npx wrangler containers push "hygge-workspace:$IMAGE_TAG"
      - name: Report immutable digest
        run: |
          digest_ref="$(docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_REPOSITORY:$IMAGE_TAG" | jq -r --arg prefix "$IMAGE_REPOSITORY@" '.[] | select(startswith($prefix))' | head -n 1)"
          if [[ ! "$digest_ref" =~ ^registry\.cloudflare\.com/[a-f0-9]+/hygge-workspace@sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not determine immutable image digest" >&2
            exit 1
          fi
          printf '%s\n' "$digest_ref" > workspace-image-ref.txt
          {
            echo "## Published workspace image"
            echo
            echo "\`$digest_ref\`"
            echo
            echo "Use this exact reference only through a separately reviewed environment image-upgrade policy."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-image-ref
          path: backend/cloudflare/workspace-image-ref.txt

  verify-pair:
    if: ${{ inputs.verify_target_image != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_IMAGE: ${{ inputs.verify_source_image }}
      TARGET_IMAGE: ${{ inputs.verify_target_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Prove isolated upgrade and latest-state rollback without publishing
        run: node container/scripts/registry-image-proof.mjs "$SOURCE_IMAGE" "$TARGET_IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-image-upgrade-proof
          path: backend/cloudflare/workspace-image-upgrade-proof.json
