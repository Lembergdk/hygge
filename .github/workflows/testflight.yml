name: TestFlight

# Manual: Actions -> TestFlight -> Run workflow.
# Build numbers come from the workflow run number (+100), so they
# always increase and never collide with local uploads.
# Signing is manual: the distribution certificate and App Store
# profile arrive as secrets (created via the ASC API), because the
# API key's role cannot use cloud-managed signing.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      # App Store uploads require the iOS 26 SDK (Xcode 26+); the
      # runner default is older, so select the newest stable Xcode.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Install signing certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=/tmp/build_certificate.p12
          PP_PATH=/tmp/profile.mobileprovision
          KEYCHAIN_PATH=/tmp/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive (unsigned; export signs)
        run: >
          xcodebuild -project Hygge.xcodeproj -scheme Hygge
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath /tmp/Hygge.xcarchive
          CURRENT_PROJECT_VERSION=$((BUILD_NUMBER + 100))
          CODE_SIGNING_ALLOWED=NO
          archive

      - name: Export IPA (manual signing)
        run: |
          cat > /tmp/ExportOptionsCI.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>3KA38L8A4F</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution: Get BOB, Inc.</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.usehygge</key>
              <string>Hygge App Store CI</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath /tmp/Hygge.xcarchive \
            -exportPath /tmp/HyggeExport \
            -exportOptionsPlist /tmp/ExportOptionsCI.plist

      - name: Upload to TestFlight
        run: >
          xcrun altool --upload-app
          -f /tmp/HyggeExport/Hygge.ipa -t ios
          --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
