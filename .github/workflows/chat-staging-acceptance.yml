name: Chat staging acceptance

on:
  workflow_dispatch:
    inputs:
      persistent_agent:
        description: "Check the persistent chat protocol instead of legacy intent"
        type: boolean
        default: false
      recover_image_fixture:
        description: "Inspect and remove login access for the preserved image-test fixture"
        type: boolean
        default: false
      workspace_image_upgrade:
        description: "Verify populated old/new image upgrade and latest-state rollback (synthetic accounts only)"
        type: boolean
        default: false
      deploy_staging:
        description: "Deploy this ref to staging before acceptance (never production)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chat-staging-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    concurrency:
      group: hygge-staging-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Record current staging deployment
        if: inputs.deploy_staging
        run: npx wrangler deployments list -c wrangler.staging.jsonc
      - name: Deploy authorized staging branch
        if: inputs.deploy_staging
        run: npx wrangler deploy -c wrangler.staging.jsonc
      - name: Verify persistent chat with a synthetic staging account
        if: ${{ inputs.persistent_agent && !inputs.workspace_image_upgrade && !inputs.recover_image_fixture }}
        run: node scripts/persistent-chat-staging-acceptance.mjs
      - name: Verify model intent using a synthetic staging account
        if: ${{ !inputs.persistent_agent && !inputs.workspace_image_upgrade && !inputs.recover_image_fixture }}
        run: node scripts/chat-staging-acceptance.mjs
      - name: Verify populated workspace image upgrade and rollback
        if: ${{ inputs.workspace_image_upgrade && !inputs.recover_image_fixture }}
        run: node scripts/workspace-image-staging-acceptance.mjs
      - name: Inspect preserved fixture and remove temporary login access
        if: ${{ always() && (inputs.recover_image_fixture || inputs.workspace_image_upgrade) }}
        run: node scripts/workspace-image-fixture-recovery.mjs
